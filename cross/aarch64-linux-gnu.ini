# Meson cross file for Raspberry Pi Zero 2 W (BCM2710A1, Cortex-A53, ARMv8-A).
#
# exe_wrapper lets `meson test` run the cross-built tests under emulation, so
# the suite is a real check of the ARM64 build rather than just proof it linked.

[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'
exe_wrapper = 'qemu-aarch64'

[built-in options]
# -mcpu rather than -march: the A53 is in-order and benefits from scheduling
# tuned to it. Safe for the Zero 2 W and any later Pi.
c_args = ['-mcpu=cortex-a53']
cpp_args = ['-mcpu=cortex-a53']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'
