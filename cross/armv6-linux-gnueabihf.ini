# Meson cross file for Raspberry Pi Zero W (BCM2835, ARM1176JZF-S, ARMv6 + VFPv2).
#
# exe_wrapper lets `meson test` run the cross-built tests under emulation, so
# the suite is a real check of the ARMv6 build rather than just proof it linked.
#
# Caveat: Debian's armhf system libraries are built for ARMv7, so a binary from
# here mixes our ARMv6 code with ARMv7 libc. It runs under qemu-arm and proves
# our own codegen is sound, but the firmware's Buildroot toolchain is what
# actually produces ARMv6-clean binaries for the board.

[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = 'pkg-config'
exe_wrapper = 'qemu-arm'

[built-in options]
# The ARM1176 has VFPv2 and no NEON. A stock armhf toolchain defaults to
# ARMv7+NEON, which builds fine and then dies with SIGILL on the board.
#
# -marm is not optional: Debian's armhf gcc defaults to Thumb, the ARM1176 has
# only Thumb-1, and Thumb-1 cannot express the hard-float VFP ABI. Without it
# gcc stops at "sorry, unimplemented: Thumb-1 'hard-float' VFP ABI".
c_args = ['-mcpu=arm1176jzf-s', '-mfpu=vfp', '-mfloat-abi=hard', '-marm']
cpp_args = ['-mcpu=arm1176jzf-s', '-mfpu=vfp', '-mfloat-abi=hard', '-marm']
c_link_args = ['-mcpu=arm1176jzf-s', '-mfpu=vfp', '-mfloat-abi=hard', '-marm']
cpp_link_args = ['-mcpu=arm1176jzf-s', '-mfpu=vfp', '-mfloat-abi=hard', '-marm']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'arm1176jzf-s'
endian = 'little'
