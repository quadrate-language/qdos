plugins {
    id 'com.android.application'
}

// Where android/build.sh leaves the native libraries and SDL's Java half
def qdosNative = project.findProperty('qdosNative') ?:
        "${System.getenv('XDG_CACHE_HOME') ?: System.getProperty('user.home') + '/.cache'}/qdos-android"

android {
    namespace = 'org.quadrate.qdos'
    compileSdk = 35

    defaultConfig {
        applicationId = 'org.quadrate.qdos'
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = '0.1.0'
    }

    sourceSets.main {
        java.srcDirs += "${qdosNative}/java"
        jniLibs.srcDirs = ["${qdosNative}/jniLibs"]
        // assets/system and assets/user, as the firmware installs them
        assets.srcDirs = ['../../programs']
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError = false
    }
}
